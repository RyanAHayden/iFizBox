  <!-- B15: the files below are relative, so a deep path (/settings/signing, which the Worker answers with this page)
       would ask for /settings/style.css and get this page again. Send it to the root with the path as the route
       (/#/settings/signing); /x/add?url=… goes to /add?url=…. The app's ifizbox://app/index.html has no deeper path. A
       <base href="/"> would fix the files but move the router's "#/…" URLs off index.html. -->
  <script id="deep-path">(function (l) {
    var p = l.pathname;
    if (!/^https?:$/.test(l.protocol) || p.lastIndexOf("/") <= 0) return;
    if (/(^|\/)add\/?$/.test(p)) return l.replace("/add" + l.search + l.hash);
    l.replace("/" + l.search + (l.hash && l.hash !== "#" ? l.hash : "#/" + p.split("/").filter(Boolean).join("/")));
  })(location);</script>
