# agent-runner (https://github.com/FIZL0/agent-runner): `tmux new -s ifizbox agent-runner run 3`
[plan]
dir = "plan"
journal = "journal"

[run]
auto_upgrade = true  # upgrade agent-runner by itself when a newer release is out, between merges
weekly_max = 98
test = "tools/check.sh"
slots = 5
auto_release = { every = 20, idle = true }  # a release every 20 landed tasks, and when the run goes idle with landed work (user 2026-11-22)
rules = "AGENTS.md"
notes = ".runner"
joinable = ["plan/TODO.md", "plan/DONE.md", "journal/*/*.md"]
untested = ["*.md", "docs/*", "journal/*", "LICENSE*"]
# The native build (tools/check.sh) needs these two; they come from the shell that starts the runner (~/.bashrc),
# so no machine paths live in the repo. Without them the gate skips the native build with a note.
pass_env = ["SWIFT_TOOLCHAIN", "IOS_SDK"]
# A session that ends or is dropped gives back the phone UI locks its task holds (iPhone 15, 7, 4S), so none
# waits out the 30-minute stale timeout.
on_exit = "tools/ui-release.sh"

[git]
push = "origin"
push_merge = true
# Uncommitted edits in the main checkout never hold a tested merge for long: after 3 minutes they move to a
# wip/main-checkout-<time> branch (and a stash), and the merge lands (agent-runner 0.38.1).
land_edited = "wip"

# Tests, tooling and releases run on Sonnet, as docs, cleanups and research do by default; a simple B or F gets
# `--model sonnet` when it is queued (AGENTS.md, Usage) (user 2026-11-23: move simple things to sonnet).
[models.kinds]
T = "sonnet"
V = "sonnet"

# The test phones, shared tools: a task that finds one busy or missing runs `run wait-for <name>`, and its session
# goes on once the phone is free. Each check is the script's `state` command (0 free, 75 busy, 69 missing).
[run.tools.iphone15]
check = "tools/ui-15.sh state"
label = "iPhone 15 Pro"
description = "Test phone for the sideload build (Lite IPA), on this desktop's USB; drive it only through tools/ui-15.sh."
page = ":8098"  # its remote (tools/remote-15.py): Use opens it, Start serves it, Stop frees a lock it took as USER
start = "tools/remote-15.py 15"

[[run.tools.iphone15.buttons]]
label = "Home"
cmd = "tools/ui-15.sh lock USER && tools/ui-15.sh USER home; r=$?; IFIZBOX_UI_TIDY=0 tools/ui-15.sh unlock USER; exit $r"

[[run.tools.iphone15.buttons]]
label = "Wake"
cmd = "tools/ui-15.sh lock USER && tools/ui-15.sh USER wake; r=$?; IFIZBOX_UI_TIDY=0 tools/ui-15.sh unlock USER; exit $r"

[[run.tools.iphone15.buttons]]
label = "Reboot"
cmd = "tools/ui-15.sh lock USER && tools/ui-15.sh USER reboot; r=$?; IFIZBOX_UI_TIDY=0 tools/ui-15.sh unlock USER; exit $r"
confirm = "Reboot the iPhone 15 Pro? It is back in about 3 minutes."

[run.tools.iphone7]
check = "tools/ui-7.sh state"
label = "iPhone 7"
description = "Test phone for the jailbreak build (.deb); drive its screen only through tools/ui-7.sh."
page = ":8099"  # its remote (tools/remote-15.py): Use opens it, Start serves it, Stop frees a lock it took as USER
start = "tools/remote-15.py 7"

[[run.tools.iphone7.buttons]]
label = "Home"
cmd = "tools/ui-7.sh lock USER && tools/ui-7.sh USER home; r=$?; IFIZBOX_UI_TIDY=0 tools/ui-7.sh unlock USER; exit $r"

[[run.tools.iphone7.buttons]]
label = "Lock"
cmd = "tools/ui-7.sh lock USER && tools/ui-7.sh USER lock-button; r=$?; IFIZBOX_UI_TIDY=0 tools/ui-7.sh unlock USER; exit $r"

[run.tools.iphone4s]
check = "tools/ui-4s.sh state"
label = "iPhone 4S"
description = "Old-iOS reference phone (Cydia look); drive its screen only through tools/ui-4s.sh."
page = ":8101"  # its remote (tools/remote-15.py): Use opens it, Start serves it, Stop frees a lock it took as USER
start = "tools/remote-15.py 4s"

[[run.tools.iphone4s.buttons]]
label = "Home"
cmd = "tools/ui-4s.sh lock USER && tools/ui-4s.sh USER home; r=$?; IFIZBOX_UI_TIDY=0 tools/ui-4s.sh unlock USER; exit $r"
