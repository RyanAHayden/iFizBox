<!doctype html>
<!--
  The sideload-only clip (Lite build, no jailbreak, no computer): one recording (rec/promo-sideload.json, shots-promo-sideload.json) at
  real time (about 100 s). It opens on a splash (the app icon, the name, one line) whose icon opens into the phone, then the recording plays through
  SPEED's segments (all 1x: real time), and ends on the name and domain. Same ground, status bar, phone and band as
  video.html; render.mjs --page promo-sideload.

    promo-sideload.html?h=1350    1350 (4:5) or 1920 (9:16); the width is 1080
    window.DURATION       the length in seconds
    window.render(t)      draws time t (a promise: the recording's frame is decoded)
    window.ready          a promise: the marks and fonts are loaded
-->
<html>
<head>
<meta charset="utf-8">
<title>Sideload-only clip</title>
<style>
  html, body { margin: 0; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--text); }
  #stage { position: relative; width: 1080px; overflow: hidden; }
  .ground { position: absolute; inset: 0; background: var(--grouped-ground); zoom: 3; }
  .phone { position: absolute; left: 0; top: 0; background: #1d1e20; transform-origin: 0 0; }
  .screen { position: absolute; overflow: hidden; background: #000; }
  .screen img { position: absolute; left: 0; top: 0; width: 402px; height: 874px; }
  .sb { position: absolute; left: 0; top: 0; width: 402px; height: 62px; color: #fff; font-size: 17px; font-weight: 600; }
  .sb.dark { color: #111; }
  .sb b { position: absolute; left: 40px; top: 22px; font-weight: 600; }
  .sb i { position: absolute; width: 3px; border-radius: 1px; background: currentColor; }
  .sb u { position: absolute; right: 36px; top: 25px; width: 23px; height: 11px; border: 1.4px solid currentColor; border-radius: 4px; box-sizing: border-box; }
  .sb u::after { content: ""; position: absolute; inset: 1.4px 6px 1.4px 1.4px; background: currentColor; border-radius: 1.5px; }
  #band { position: absolute; left: 0; top: 0; width: 1080px; overflow: hidden; }
  .cap { position: absolute; left: 0; width: 1080px; text-align: center; font-size: 66px; line-height: 1.1; font-weight: 700; letter-spacing: -1px; text-shadow: var(--emboss); }
  #icon { position: absolute; left: 0; top: 0; object-fit: cover; }
  #splash { position: absolute; left: 0; width: 1080px; text-align: center; text-shadow: var(--emboss); }
  #splash .name { font-size: 132px; line-height: 1.1; font-weight: 700; letter-spacing: -3px; }
  #splash .line { font-size: 66px; line-height: 1.2; font-weight: 500; margin-top: 28px; }
  #end { position: absolute; left: 0; top: 0; width: 1080px; text-align: center; text-shadow: var(--emboss); }
  #end img { width: 230px; height: 230px; border-radius: 51px; }
  #end .name { font-size: 92px; font-weight: 700; letter-spacing: -2px; margin-top: 26px; }
  #end .url { font-size: 68px; font-weight: 500; margin-top: 56px; }
  #end .lic { font-size: 48px; color: var(--head); margin-top: 18px; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { NAME, DOMAIN } from "../../web/app/brand.js";
const W = 1080, H = Number(new URLSearchParams(location.search).get("h") || 1350), TALL = H > 1500;
const stage = document.getElementById("stage");
stage.style.height = H + "px";
const ios6 = await (await fetch("../../web/app/ios6.css")).text();
for (const n of ["--pin-dark", "--pin-light", "--grouped-ground", "--text", "--head", "--emboss"]) {
  const m = ios6.match(new RegExp(`${n}:\\s*([^;]+);`));
  if (!m) throw new Error(`no ${n} in ios6.css`);
  document.documentElement.style.setProperty(n, m[1]);
}
const mk = (cls, html = "", parent = stage) => { const e = document.createElement("div"); e.className = cls; e.innerHTML = html; parent.append(e); return e; };
mk("ground");
const clamp = (x) => Math.min(1, Math.max(0, x));
const smooth = (x) => { x = clamp(x); return x * x * x * (x * (6 * x - 15) + 10); };
const mix = (a, b, k) => a + (b - a) * k;
const fade = (t, a, b, d = 0.22) => Math.min(smooth((t - a) / d), smooth((b - t) / d));
const frame = (x) => Math.round(x * 60) / 60;

const rec = await (await fetch("/rec/promo-sideload.json")).json();
const at = (mark) => { const m = rec.marks.find((x) => x.name === mark); if (!m) throw new Error(`no mark ${mark} in promo-sideload`); return frame(m.t); };

// ---- the splash, then the phone: the icon opens into the phone at OPEN (0.9 s), and the recording starts as it settles
const OPEN = 2.2, START = OPEN + 0.6;

// ---- SPEED: how many times faster the recording plays from each mark to the next. Every mark plays at 1 (real time); the length
// comes from the recording script's own pauses, never from speeding playback.
const DEFAULT = 1, FASTER = 1; // real time: the recording plays at its own speed, as the app really moves
const SPEED = {}; // a mark named here would play faster or slower; none does
const names = rec.marks.map((m) => m.name);
const segs = [];
let out = START;
for (let i = 0; i < names.length - 1; i++) {
  const from = at(names[i]), to = at(names[i + 1]), k = (SPEED[names[i]] ?? DEFAULT) * FASTER, len = (to - from) / k;
  segs.push({ from, to, k, t0: out, t1: out + len }); out += len;
}
const RECEND = out;
// the output time of a mark
const when = (mark, dx = 0) => { const s = segs.find((x) => x.from >= at(mark) - 1e-6) ?? segs.at(-1); return s.t0 + dx; };
const END = RECEND + 0.5;
window.DURATION = Math.ceil((END + 2.8) * 60) / 60;

// ---- the phone: a screen 402 points wide, scaled to fit under the words
const PAD = 15, pw = 402 + 2 * PAD, ph = 874 + 2 * PAD;
const el = mk("phone");
const screen = mk("screen", "<img>", el);
Object.assign(el.style, { width: pw + "px" });
Object.assign(screen.style, { left: PAD + "px", top: PAD + "px", width: "402px" });
const sb = mk("sb", `<b>12:30</b>${[5, 7, 9, 12].map((h, n) => `<i style="right:${82 - n * 5}px;height:${h}px;bottom:25px"></i>`).join("")}<u></u>`, screen);
const img = screen.querySelector("img");
let shown = 0;
const BAND = TALL ? 260 : 160, CAPY = TALL ? 122 : 46;
const WHOLE = (H - BAND - 34) / ph;
const ICON = 420, ICONY = (H - 800) / 2;

// ---- the words
const band = mk("", `<div class="ground"></div>`); band.id = "band"; band.style.height = BAND + "px";
const words = [];
const say = (a, b, text) => { const e = mk("cap", text); e.style.top = CAPY + "px"; words.push({ e, a, b }); };
say(START - 0.1, when("remove"), "Import your own certificate");
say(when("remove"), when("sources"), "Or sign in with a free Apple ID");
say(when("sources"), when("details"), "Install apps from AltStore sources");
say(when("details"), when("changes") - 0.3, "Tweaks, signed on your iPhone");
say(when("changes") - 0.3, when("signedapps") - 0.4, "Updates, one tap");
say(when("signedapps") - 0.4, RECEND, "Re-sign All, before they expire");

// ---- the splash: there from the first frame, which is the video's poster too
const icon = new Image(); icon.id = "icon"; icon.src = "../../web/app/icons/icon-glossy.svg"; stage.append(icon);
const splash = mk("", `<div class="name">${NAME}</div><div class="line">no jailbreak,<br>no computer</div>`);
splash.id = "splash"; splash.style.top = ICONY + ICON + 48 + "px";
const end = mk("", `<img src="../../web/app/icons/icon-glossy-228.png"><div class="name">${NAME}</div><div class="url">${DOMAIN}</div><div class="lic">Free, GPL-3.0</div>`);
end.id = "end";

window.render = async (t) => {
  const open = smooth((t - OPEN) / 0.9), out = smooth((t - END) / 0.6);
  const s = Math.min(segs.at(-1).to, t <= START ? 0 : (() => { const g = segs.find((x) => t < x.t1) ?? segs.at(-1); return g.from + Math.min(t - g.t0, g.t1 - g.t0) * g.k; })());
  const n = Math.min(rec.frames, Math.max(1, Math.floor(s * rec.fps + 1e-6) + 1));
  const look = rec.looks.filter((l) => l.t <= s + 1e-6).at(-1) ?? rec.looks[0];
  sb.classList.toggle("dark", look.style !== "ios6" && look.theme !== "dark");
  // the phone grows out of the icon's square while the icon over it fades
  const x0 = (W - ICON) / 2, x1 = (W - pw * WHOLE) / 2, y1 = BAND + 8 + out * (H + 40);
  const sc = mix(ICON / pw, WHOLE, open), h = mix(pw, ph, open), r = mix(pw * 180 / 1024, 66, open);
  Object.assign(el.style, { height: h + "px", borderRadius: r + "px", transform: `translate(${mix(x0, x1, open).toFixed(2)}px, ${mix(ICONY, y1, open).toFixed(2)}px) scale(${sc.toFixed(5)})`, visibility: open > 0 ? "visible" : "hidden" });
  Object.assign(screen.style, { height: h - 2 * PAD + "px", borderRadius: r - 14 + "px" });
  Object.assign(icon.style, { transform: `translate(${mix(x0, x1, open).toFixed(2)}px, ${mix(ICONY, y1, open).toFixed(2)}px)`, width: pw * sc + "px", height: h * sc + "px", borderRadius: r * sc + "px", opacity: 1 - smooth(open / 0.6), visibility: open < 1 ? "visible" : "hidden" });
  splash.style.opacity = 1 - smooth((t - OPEN) / 0.3);
  band.style.opacity = smooth((t - OPEN - 0.5) / 0.4);
  for (const w of words) w.e.style.opacity = w.a <= START && t < w.b ? Math.min(smooth((t - START + 0.1) / 0.3), smooth((w.b - t) / 0.22)) : fade(t, w.a, w.b);
  const e = smooth((t - END - 0.35) / 0.5);
  end.style.opacity = e;
  end.style.transform = `translateY(${(H / 2 - 330 + (1 - e) * 24).toFixed(2)}px)`;
  if (t >= OPEN - 0.1 && n !== shown) {
    shown = n;
    img.src = `/frames/promo-sideload/${String(n).padStart(5, "0")}.jpg`;
    await img.decode();
  }
};
window.ready = Promise.all([icon, ...end.querySelectorAll("img")].map((i) => i.decode())).then(() => document.fonts.ready).then(() => window.render(0)).then(() => true);
</script>
</body>
</html>
