# iFizBox's install server (src/index.js). Deploy your own: worker/README.md.
name = "ifizbox-sign"
main = "entry.js"   # src/index.js's handler without its test-only exports, which `wrangler dev` won't start with
# The website: web/app/ served as static assets (index.html for app routes like /add).
assets = { directory = "../web/app", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = ["/sign/*", "/api/*", "/healthz", "/repo", "/repo/*", "/reviews/*", "/apple/*"] }
compatibility_date = "2026-11-01"

[vars]
HOST_IDS = "*"   # bundle IDs /sign/host keeps: any app, whatever ID the user's profile signs it under
TTL = "600"              # seconds a hosted update (or a website-signed app) stays
MAX_UPLOAD_MB = "512"    # largest IPA the website signs in the browser (/api/fetch?kind=ipa, /sign/upload); "0": none

# Wrangler makes this storage on the first deploy (or: `npx wrangler kv namespace create HOSTED`, and its id here).
[[kv_namespaces]]
binding = "HOSTED"

# F98: /api/account's per-address limit across isolates (Cloudflare's Rate Limiting binding, free; src/account.js).
# Without these it counts in each isolate's memory. period is 10 or 60 seconds; namespace_id is any number,
# unique in your account. Keep limit at ACCOUNT_RATE / ACCOUNT_WRITES.
[[ratelimits]]
name = "ACCOUNT_RATE_LIMIT"
namespace_id = "9801"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "ACCOUNT_WRITE_LIMIT"
namespace_id = "9802"
simple = { limit = 12, period = 60 }

# F182: user reviews (src/reviews.js) in D1, free on the Workers Free plan (5 GB, 100,000 rows written a day). Wrangler
# makes the database on the first deploy, like HOSTED (or: `npx wrangler d1 create ifizbox-reviews`, and its
# database_id here); the Worker makes its tables itself. Owner-only delete: `npx wrangler secret put REVIEWS_ADMIN`.
# Optional: REVIEWS_SALT (a secret) salts the stored token and address hashes.
[[d1_databases]]
binding = "REVIEWS"
database_name = "ifizbox-reviews"

# F280: push notifications (src/push.js, docs/push.md): devices and what they follow, in their own D1 database (made
# on the first deploy, like REVIEWS). Push stays off until you add an APNs Auth Key from the Apple team that owns the
# topic's App ID: `npx wrangler secret put APNS_KEY` (the AuthKey_<id>.p8 file's text), then APNS_KEY_ID and
# APNS_TEAM_ID (secrets or [vars]), and APNS_TOPICS if your iFizBox runs under another bundle ID.
[[d1_databases]]
binding = "PUSH"
database_name = "ifizbox-push"

# F344: the tweak index (src/tweakindex.js, GET /api/tweaks): which app each Tweak Source's tweaks are for, in its own
# D1 database (made on the first deploy, like REVIEWS). Without it /api/tweaks answers {enabled: false} and the app
# checks tweaks on the phone. TWEAK_INDEX_PER_RUN ([vars], default 20) caps the .debs one cron run downloads.
[[d1_databases]]
binding = "TWEAKS"
database_name = "ifizbox-tweaks"

# F280: the push check runs every 30 minutes (it does nothing without an APNs key). F344: the tweak index too.
[triggers]
crons = ["*/30 * * * *"]

# F182: review writes (posts, reports) per address across isolates; keep limit at REVIEW_WRITES.
[[ratelimits]]
name = "REVIEW_RATE_LIMIT"
namespace_id = "9803"
simple = { limit = 6, period = 60 }

# F312: per-address limits on the fetch proxy and the upload routes (src/limits.js); keep each limit at its
# FETCH_RATE / HOST_RATE / UPLOAD_RATE default (300, 10, 12 a minute). Without these, each isolate counts in memory.
[[ratelimits]]
name = "FETCH_RATE_LIMIT"
namespace_id = "9804"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "HOST_RATE_LIMIT"
namespace_id = "9805"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "UPLOAD_RATE_LIMIT"
namespace_id = "9806"
simple = { limit = 12, period = 60 }
