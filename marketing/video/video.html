<!doctype html>
<!--
  The showcase video as one page, cut from the recordings capture.mjs made. Every frame is render(t) of a virtual
  clock (no CSS animations, no timers): render.mjs steps it 1/60 s at a time and screenshots each frame.

    video.html?h=1350     1350 (4:5) or 1920 (9:16); the width is 1080
    /rec/<name>.json, /frames/<name>/00001.jpg…   the recordings and their frames (render.mjs serves them)
    window.DURATION       the length in seconds
    window.render(t)      draws time t (a promise: the recordings' frames are decoded)
    window.ready          a promise: the marks and images are loaded

  The flow is never cut: the recordings run from mark to mark, some stretches faster (MAP). The phone is a plain
  rounded frame drawn here (no device artwork). The name and domain come from web/app/brand.js.
-->
<html>
<head>
<meta charset="utf-8">
<title>Showcase video</title>
<style>
  html, body { margin: 0; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #24272c; }
  #stage { position: relative; width: 1080px; overflow: hidden; background: #e4e1da; }
  .abs { position: absolute; left: 0; top: 0; }
  .phone { position: absolute; left: 0; top: 0; background: #1d1e20; transform-origin: 0 0; }
  .screen { position: absolute; overflow: hidden; background: #000; }
  .screen img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sb { position: absolute; left: 0; top: 0; width: 402px; height: 62px; transform-origin: 0 0; color: #fff; font-size: 17px; font-weight: 600; }
  .sb.dark { color: #111; }
  .sb b { position: absolute; left: 40px; top: 22px; font-weight: 600; }
  .sb i { position: absolute; bottom: 21px; width: 3px; border-radius: 1px; background: currentColor; }
  .sb u { position: absolute; right: 36px; top: 25px; width: 23px; height: 11px; border: 1.4px solid currentColor; border-radius: 4px; box-sizing: border-box; }
  .sb u::after { content: ""; position: absolute; inset: 1.4px 6px 1.4px 1.4px; background: currentColor; border-radius: 1.5px; }
  #band { position: absolute; left: 0; top: 0; width: 1080px; background: #e4e1da; }
  .cap { position: absolute; left: 0; width: 1080px; text-align: center; font-size: 66px; line-height: 1.1; font-weight: 700; letter-spacing: -1px; }
  .build { position: absolute; left: 0; width: 1080px; text-align: center; font-size: 42px; font-weight: 500; color: #6a6459; }
  .label { position: absolute; left: 0; top: 0; text-align: center; font-size: 52px; font-weight: 700; }
  #end { width: 1080px; text-align: center; }
  #end img { width: 230px; height: 230px; border-radius: 51px; }
  #end .name { font-size: 92px; font-weight: 700; letter-spacing: -2px; margin-top: 26px; }
  #end .url { font-size: 68px; font-weight: 500; margin-top: 56px; }
  #end .lic { font-size: 48px; color: #6a6459; margin-top: 18px; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { NAME, DOMAIN } from "../../web/app/brand.js";

const W = 1080, H = Number(new URLSearchParams(location.search).get("h") || 1350), TALL = H > 1500;
const stage = document.getElementById("stage");
stage.style.height = H + "px";
const mk = (cls, html = "", parent = stage) => { const e = document.createElement("div"); e.className = cls; e.innerHTML = html; parent.append(e); return e; };
const clamp = (x) => Math.min(1, Math.max(0, x));
const smooth = (x) => { x = clamp(x); return x * x * x * (x * (6 * x - 15) + 10); };
const mix = (a, b, k) => a + (b - a) * k;
const fade = (t, a, b, d = 0.22) => Math.min(smooth((t - a) / d), smooth((b - t) / d));

const rec = {};
for (const n of ["lite", "jailbreak"]) {
  rec[n] = await (await fetch(`/rec/${n}.json`)).json();
  rec[n].at = (mark) => { const m = rec[n].marks.find((x) => x.name === mark); if (!m) throw new Error(`no mark ${mark} in ${n}`); return m.t; };
}

// ---- MAP: what each recording shows, as stretches of [its mark, the seconds the video takes to get to the next one]
const HOLD = 2.7;  // both phones rest on Home before the fingers start
const LITE = [["home", 2.1], ["sources", 1.0], ["add-source", 2.4], ["unknown-source", 1.4], ["source-added", 0.8],
  ["search", 1.7], ["found", 1.6], ["app", 2.0], ["confirm-install", 0.9], ["installing", 1.9], ["installed", 1.0],
  ["app-installed", 0.9], ["changes", 1.9], ["update-found", 1.2], ["confirm-update", 2.2], ["updated", 0.9],
  ["up-to-date", 1.5], ["theme", 1.3], ["ios7", 1.3], ["ios13", 1.3], ["ios26", 1.3], ["home-ios26", 1.5], ["ios6", 1.0], ["end", 0]];
// the jailbreak recording's Sources steps are the Lite one's again, so its part starts on Search
const JAIL = [["search", 1.6], ["found", 2.0], ["queued", 1.4], ["tweak", 1.5], ["confirm", 0.9], ["installing", 2.0], ["end", 0]];
function plan(name, stretches, start) {
  let t = start;
  const points = stretches.map(([mark, d]) => { const p = { mark, t, src: rec[name].at(mark) }; t += d; return p; });
  return {
    from: start, to: points.at(-1).t, when: (mark) => points.find((p) => p.mark === mark).t,
    src(x) {
      if (x <= points[0].t) return points[0].src;
      for (let i = 1; i < points.length; i++) if (x < points[i].t) return mix(points[i - 1].src, points[i].src, (x - points[i - 1].t) / (points[i].t - points[i - 1].t));
      return points.at(-1).src;
    },
  };
}
const lite = plan("lite", LITE, HOLD);
const TAKE = HOLD + 1.6;        // the no-jailbreak phone takes over
const SWAP = lite.to + 0.35;    // the jailbroken phone comes back in its place
const jail = plan("jailbreak", JAIL, SWAP + 0.9);
const END = jail.to + 0.5;      // the end card
window.DURATION = Math.ceil((END + 3.1) * 60) / 60;

// ---- the phones: a screen 402 points wide, scaled by place()
const PAD = 15;
function phone(name) {
  const el = mk("phone");
  Object.assign(el.style, { width: 402 + 2 * PAD + "px", height: 874 + 2 * PAD + "px", borderRadius: "66px" });
  const screen = mk("screen", "<img>", el);
  Object.assign(screen.style, { left: PAD + "px", top: PAD + "px", width: "402px", height: "874px", borderRadius: "52px" });
  const sb = mk("sb", `<b>12:30</b>${[5, 7, 9, 12].map((h, n) => `<i style="right:${82 - n * 5}px;height:${h}px;bottom:25px"></i>`).join("")}<u></u>`, screen);
  const img = screen.querySelector("img");
  let shown = 0;
  return {
    el,
    place(x, y, s) { el.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${s.toFixed(5)})`; },
    async show(src) {
      const r = rec[name], n = Math.min(r.frames, Math.max(1, Math.floor(src * r.fps + 1e-6) + 1));
      const look = r.looks.filter((l) => l.t <= src + 1e-6).at(-1) ?? r.looks[0];
      // iOS 6's status strip is black; the later looks' is the page's own light one, except under a run's black page
      sb.classList.toggle("dark", look.style !== "ios6" && look.theme !== "dark");
      if (n === shown) return;
      shown = n;
      img.src = `/frames/${name}/${String(n).padStart(5, "0")}.jpg`;
      await img.decode();
    },
  };
}
const A = phone("lite"), B = phone("jailbreak");

// ---- the words
const BAND = TALL ? 290 : 214, CAPY = TALL ? 112 : 46;
const band = mk(""); band.id = "band"; band.style.height = BAND + "px";
const words = [];
const say = (a, b, text) => { const e = mk("cap", text); e.style.top = CAPY + "px"; words.push({ e, a, b }); };
const build = (a, b, text) => { const e = mk("build", text); e.style.top = CAPY + 88 + "px"; words.push({ e, a, b }); };
const L = lite.when, J = jail.when;
const opening = mk("cap", `${NAME} works with<br>or without a jailbreak`);
opening.style.top = (TALL ? 230 : 70) + "px";
build(TAKE + 0.5, SWAP, "No jailbreak");
say(TAKE + 0.5, L("search"), "Add a source");
say(L("search"), L("app") + 0.2, "Find an app");
say(L("app") + 0.2, L("changes") - 0.2, "Tap Install");
say(L("changes") - 0.2, L("up-to-date") + 0.6, "New version? Tap Upgrade");
say(L("up-to-date") + 0.6, L("ios7") - 1.1, "Change how it looks");
say(L("ios7") - 1.1, L("ios13") - 1.1, "This is iOS 7");
say(L("ios13") - 1.1, L("ios26") - 1.1, "iOS 13");
say(L("ios26") - 1.1, L("ios6") - 0.6, "iOS 26");
say(L("ios6") - 0.6, SWAP, "And back to iOS 6");
build(SWAP + 0.4, END, "Jailbroken");
say(SWAP + 0.4, J("found") + 0.5, "This one gets system tweaks");
say(J("found") + 0.5, J("tweak") - 0.2, "Swipe one to queue it");
say(J("tweak") - 0.2, END, "Add another, install both");

const PAIR = TALL ? 1.1 : 1.02, pw = (402 + 2 * PAD), ph = (874 + 2 * PAD);
const gap = (W - 2 * pw * PAIR) / 3, pairY = TALL ? 640 : 330;
const labels = ["No jailbreak", "Jailbroken"].map((text, i) => { const e = mk("label", text); e.style.width = pw * PAIR + "px"; e.style.left = gap + i * (pw * PAIR + gap) + "px"; e.style.top = pairY - 84 + "px"; return e; });

const end = mk("abs", `<img src="../../web/app/icons/icon-glossy-228.png"><div class="name">${NAME}</div><div class="url">${DOMAIN}</div><div class="lic">Free, GPL-3.0</div>`);
end.id = "end";

// ---- the one phone's place: whole on screen, and closer (4:5 only) while there are words to read on it
const WHOLE = (H - BAND - 34) / ph, NEAR = TALL ? WHOLE : 1.62;
const zooms = TALL ? [] : [ // [from, to, the point of the screen, in points from its top, kept in the middle]
  [L("add-source") - 0.25, L("unknown-source") + 1.0, 330], [L("search") + 0.2, L("app") - 0.1, 330], [L("confirm-install") - 0.1, L("installing") + 0.3, 320],
  [L("update-found") - 0.1, L("confirm-update") + 0.5, 330], [L("theme") + 0.2, L("ios26") + 0.4, 330],
  [J("search") + 0.1, J("installing") + 0.2, 330],
];
function solo(t) {
  let k = 0, mid = 437;
  for (const [a, b, y] of zooms) { const z = Math.min(smooth((t - a) / 0.7), smooth((b + 0.7 - t) / 0.7)); if (z > k) { k = z; mid = y; } }
  const s = mix(WHOLE, NEAR, k), room = H - BAND;
  const whole = BAND + 8, near = Math.min(BAND + 8, BAND + room / 2 - (mid + PAD) * NEAR);
  return { x: (W - pw * s) / 2, y: mix(whole, near, k), s };
}

window.render = async (t) => {
  const take = smooth((t - TAKE) / 0.9), swap = smooth((t - SWAP) / 0.8), out = smooth((t - END) / 0.6);
  const one = solo(t);
  const a = { x: gap, y: pairY, s: PAIR }, b = { x: 2 * gap + pw * PAIR, y: pairY, s: PAIR };
  A.place(mix(a.x, one.x, take) - swap * (W + 60), mix(a.y, one.y, take), mix(a.s, one.s, take));
  if (t < SWAP) B.place(b.x + take * (W + 60), b.y, b.s);
  else B.place(one.x + (1 - swap) * (W + 60), one.y + out * (H + 40), one.s);
  A.el.style.visibility = t < SWAP + 0.85 ? "visible" : "hidden";
  B.el.style.visibility = t < TAKE + 0.95 || t >= SWAP ? "visible" : "hidden";
  band.style.opacity = t < TAKE ? 0 : Math.min(smooth((t - TAKE) / 0.5), 1);
  opening.style.opacity = fade(t, -1, TAKE + 0.3); // there from the first frame, which is the video's poster too
  labels.forEach((l, i) => { l.style.opacity = 1 - smooth((t - TAKE) / 0.3); });
  for (const w of words) w.e.style.opacity = fade(t, w.a, w.b);
  const e = smooth((t - END - 0.35) / 0.5);
  end.style.opacity = e;
  end.style.transform = `translateY(${(H / 2 - 330 + (1 - e) * 24).toFixed(2)}px)`;
  const jobs = [];
  if (t < SWAP + 0.9) jobs.push(A.show(lite.src(t)));
  if (t < TAKE + 1) jobs.push(B.show(Math.max(0, t < HOLD ? 0 : mix(0, rec.jailbreak.at("sources"), clamp((t - HOLD) / 2.1)))));
  else if (t >= SWAP - 0.1) jobs.push(B.show(jail.src(t)));
  await Promise.all(jobs);
};
window.ready = Promise.all([...end.querySelectorAll("img")].map((i) => i.decode())).then(() => document.fonts.ready).then(() => window.render(0)).then(() => true);
</script>
</body>
</html>
