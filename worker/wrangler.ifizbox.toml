# ifizbox.com's own deploy, on release tags only: tools/deploy.sh vX.Y.Z (tools/publish.sh runs it right after it tags a
# release) checks the tag out and runs tools/buildinfo.sh && cd worker && npx wrangler deploy -c wrangler.ifizbox.toml
# (yours: wrangler.toml, README.md). A push to main deploys nothing.
name = "ifizbox"
main = "entry.js"   # src/index.js's handler without its test-only exports, which `wrangler dev` won't start with
# The website: web/app/ served as static assets (index.html for app routes like /add).
assets = { directory = "../web/app", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = ["/sign/*", "/api/*", "/healthz", "/repo", "/repo/*", "/reviews/*", "/apple/*"] }
compatibility_date = "2026-11-01"
routes = [
  # Custom domains: Cloudflare makes their DNS records and certificates (the zone needs no records of its own for them).
  { pattern = "ifizbox.com", custom_domain = true },
  { pattern = "www.ifizbox.com", custom_domain = true },
  { pattern = "sign.ifizbox.com", custom_domain = true },
]

[vars]
HOST_IDS = "*"   # bundle IDs /sign/host keeps: any app, whatever ID the user's profile signs it under
TTL = "600"              # seconds a hosted update (or a website-signed app) stays
MAX_UPLOAD_MB = "512"    # largest IPA the website signs in the browser (/api/fetch?kind=ipa, /sign/upload); "0": none
APNS_TEAM_ID = "S8NFX3A2LT"   # F280: the team whose APNs key pushes to com.ryha.ifizbox (src/push.js)
APPLE_RELAY = "1"   # Free Apple ID route: the /apple/<host>/<path> relay (src/apple-relay.js; user 2026-11-20)

# Wrangler makes this storage on the first deploy (or: `npx wrangler kv namespace create HOSTED`, and its id here).
[[kv_namespaces]]
binding = "HOSTED"
id = "34714fc96ca44db29c935c4a68594bcf"

# F98: /api/account's per-address limit across isolates (Cloudflare's Rate Limiting binding, free; src/account.js).
# Without these it counts in each isolate's memory. period is 10 or 60 seconds; namespace_id is any number,
# unique in your account. Keep limit at ACCOUNT_RATE / ACCOUNT_WRITES.
[[ratelimits]]
name = "ACCOUNT_RATE_LIMIT"
namespace_id = "9801"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "ACCOUNT_WRITE_LIMIT"
namespace_id = "9802"
simple = { limit = 12, period = 60 }

# F182/F185: user reviews (src/reviews.js) in D1. No database_id: Wrangler makes the database on the first deploy
# (or: `npx wrangler d1 create ifizbox-reviews`, and its database_id here); the Worker makes its tables itself.
# A person sets the secrets: `npx wrangler secret put REVIEWS_ADMIN -c wrangler.ifizbox.toml` (owner-only delete),
# optionally REVIEWS_SALT (salts the stored token and address hashes).
[[d1_databases]]
binding = "REVIEWS"
database_name = "ifizbox-reviews"

# Push notifications (src/push.js, docs/push.md) in their own D1 database (made on the first deploy). The APNs Auth
# Key of team S8NFX3A2LT (developer.apple.com > Keys > + > Apple Push Notifications service) is set as secrets:
# `npx wrangler secret put APNS_KEY -c wrangler.ifizbox.toml` (the .p8's text) and APNS_KEY_ID. Keep the `-c`:
# without it wrangler uses wrangler.toml and makes a separate Worker.
[[d1_databases]]
binding = "PUSH"
database_name = "ifizbox-push"

# F344: the tweak index (src/tweakindex.js, GET /api/tweaks) in its own D1 database (made on the first deploy); the
# cron below also works through it, TWEAK_INDEX_PER_RUN .debs a run (default 20).
[[d1_databases]]
binding = "TWEAKS"
database_name = "ifizbox-tweaks"

[triggers]
crons = ["*/30 * * * *"]

# F182: review writes (posts, reports) per address across isolates; keep limit at REVIEW_WRITES.
[[ratelimits]]
name = "REVIEW_RATE_LIMIT"
namespace_id = "9803"
simple = { limit = 6, period = 60 }

# F312: per-address limits on the fetch proxy and the upload routes (src/limits.js); keep each limit at its
# FETCH_RATE / HOST_RATE / UPLOAD_RATE default (300, 10, 12 a minute). Without these, each isolate counts in memory.
[[ratelimits]]
name = "FETCH_RATE_LIMIT"
namespace_id = "9804"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "HOST_RATE_LIMIT"
namespace_id = "9805"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "UPLOAD_RATE_LIMIT"
namespace_id = "9806"
simple = { limit = 12, period = 60 }
